<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Adventures of Hassan - Interactive Comic</title>
    <style>
        /* CSS reset and fonts */
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap');
        
        :root {
            --comic-bg: #fdf5e6;
            --ink: #111;
            --panel-border: #000;
            --highlight: #f8c92a;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --accent-green: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Neue', cursive;
            background: #4a3b32 url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="%234a3b32"/><path d="M0 0l100 100M100 0L0 100" stroke="%233e312a" stroke-width="2" opacity="0.3"/></svg>'); /* Wooden desk texture */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--ink);
        }

        /* Desk items */
        .desk-item {
            position: absolute;
            pointer-events: auto;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .coffee-mug {
            bottom: 50px;
            right: 100px;
            width: 80px;
            height: 80px;
            z-index: 0;
        }
        .pencil {
            top: 50px;
            left: 150px;
            width: 150px;
            height: 20px;
            transform: rotate(-15deg);
            z-index: 0;
        }

        /* Comic Book Container */
        .comic-book {
            width: 90vw;
            max-width: 1200px;
            height: 90vh;
            max-height: 800px;
            position: relative;
            perspective: 2500px;
            box-shadow: 20px 20px 30px rgba(0,0,0,0.5);
            background: #2c3e50; /* Hardcover color */
            border: 4px solid #1a252f;
            border-radius: 4px;
            z-index: 10;
            display: flex;
        }

        .comic-book::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 40px;
            transform: translateX(-50%);
            background: linear-gradient(to right, transparent, rgba(0,0,0,0.3) 10%, rgba(255,255,255,0.1) 50%, rgba(0,0,0,0.3) 90%, transparent);
            z-index: 2;
            pointer-events: none;
        }

        .inside-cover {
            flex: 1;
            height: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #34495e; /* Inner paper */
            border: 10px solid #2c3e50;
            color: #ecf0f1;
            text-align: center;
            font-family: 'Bangers', cursive;
        }
        
        .inside-cover-left {
            border-right: none;
        }
        .inside-cover-right {
            border-left: none;
        }

        /* Pages */
        .page {
            width: 50%;
            height: 100%;
            position: absolute;
            top: 0;
            right: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            background: var(--comic-bg);
            border: 1px solid var(--ink);
            z-index: 1;
            /* Paper texture */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.05"/></svg>'), linear-gradient(to right, rgba(0,0,0,0.1) 0%, transparent 5%, transparent 95%, rgba(0,0,0,0.05) 100%);
            cursor: pointer;
        }

        .page.flipped {
            transform: rotateY(-180deg);
        }

        .page-front, .page-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page-back {
            transform: rotateY(180deg);
            background: #f4ebd8;
        }

        /* Comic Elements */
        .panel {
            border: 4px solid var(--panel-border);
            background: #fff;
            position: relative;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        .panel:hover {
            transform: scale(1.02);
            z-index: 10;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
        }

        .caption {
            background: var(--highlight);
            border: 2px solid var(--ink);
            padding: 8px 12px;
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: 2px 2px 0 var(--ink);
            z-index: 5;
        }

        .speech-bubble {
            background: #fff;
            border: 3px solid var(--ink);
            border-radius: 50%;
            padding: 15px 20px;
            position: absolute;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 3px 3px 0 var(--ink);
            animation: float 3s ease-in-out infinite;
            z-index: 5;
        }
        
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            border-width: 15px 15px 0 0;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -19px;
            left: 48%;
            border-width: 18px 18px 0 0;
            border-style: solid;
            border-color: var(--ink) transparent transparent transparent;
            z-index: -1;
        }

        .sound-effect {
            font-family: 'Bangers', cursive;
            font-size: 3rem;
            color: var(--accent-red);
            text-shadow: 3px 3px 0 #fff, 6px 6px 0 var(--ink);
            position: absolute;
            transform: rotate(-15deg);
            z-index: 6;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
        }

        /* Halftone background utility */
        .halftone {
            background: radial-gradient(circle, var(--accent-blue) 2px, transparent 2.5px);
            background-size: 10px 10px;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }
        @keyframes pop {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            80% { transform: scale(1.2) rotate(-10deg); opacity: 1; }
            100% { transform: scale(1) rotate(-15deg); }
        }
        
        .comic-title {
            font-family: 'Bangers', cursive;
            font-size: 6rem;
            text-align: center;
            color: var(--highlight);
            text-shadow: 4px 4px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink);
            line-height: 1.1;
            margin-top: 50px;
            position: relative;
            z-index: 10;
            animation: pulseTitle 2s infinite alternate;
        }

        @keyframes pulseTitle {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        /* Layout grids for panels */
        .panel-grid-1 { display: grid; grid-template-rows: 1fr; height: 100%; gap: 15px; }
        .panel-grid-2 { display: grid; grid-template-rows: 1fr 1fr; height: 100%; gap: 15px; }
        .panel-grid-3 { display: grid; grid-template-rows: 1fr 1fr 1fr; height: 100%; gap: 15px; }
        .panel-grid-custom-1 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 100%; gap: 15px; }
        .span-2 { grid-column: span 2; }

        /* Cover specific styles */
        .cover-art {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            overflow: hidden;
            background: #87CEEB; /* Sky blue */
        }
        
        .issue-number {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff;
            border: 3px solid var(--ink);
            padding: 10px;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            transform: rotate(5deg);
            z-index: 20;
            box-shadow: 3px 3px 0 var(--accent-red);
        }

        .barcode {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 80px;
            height: 60px;
            background: repeating-linear-gradient(to right, #000, #000 2px, #fff 2px, #fff 4px, #000 4px, #000 8px, #fff 8px, #fff 10px);
            border: 2px solid #fff;
            z-index: 20;
        }

        .price-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--highlight);
            border: 3px solid var(--ink);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            z-index: 20;
            box-shadow: 2px 2px 0 var(--ink);
            transform: rotate(-15deg);
        }

        /* Intro Text overlay */
        .intro-text {
            font-size: 1.2rem;
            background: rgba(255,255,255,0.95);
            border: 2px solid var(--ink);
            padding: 15px;
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: 65%;
            z-index: 20;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            font-weight: bold;
        }

        /* Characters & SVGs */
        .svg-layer {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Page Navigation Instructions */
        .nav-instruction {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            text-shadow: 2px 2px 0 #000;
            animation: pulseTitle 1.5s infinite alternate;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>

        const comicBook = document.getElementById('comicBook');
        let currentPage = 0;
        let isAnimating = false;

        // Render Pages
        pagesData.forEach((page, index) => {
            const pageEl = document.createElement('div');
            pageEl.className = 'page';
            // Z-index: first page on top.
            pageEl.style.zIndex = pagesData.length - index;

            const frontEl = document.createElement('div');
            frontEl.className = 'page-front';
            frontEl.innerHTML = page.front;

            const backEl = document.createElement('div');
            backEl.className = 'page-back';
            backEl.innerHTML = page.back;

            pageEl.appendChild(frontEl);
            pageEl.appendChild(backEl);

            // Click to flip
            pageEl.addEventListener('click', () => {
                if(isAnimating) return;
                
                if (pageEl.classList.contains('flipped')) {
                    // Flip back (only if it's the current active left page)
                    if (index === currentPage - 1) {
                        isAnimating = true;
                        pageEl.style.zIndex = 100; // Keep on top during flip
                        pageEl.classList.remove('flipped');
                        currentPage--;
                        setTimeout(() => {
                            updateZIndices();
                            isAnimating = false;
                        }, 1000);
                    }
                } else {
                    // Flip forward
                    if (index === currentPage) {
                        isAnimating = true;
                        pageEl.style.zIndex = 100; // Keep on top during flip
                        pageEl.classList.add('flipped');
                        currentPage++;
                        setTimeout(() => {
                            updateZIndices();
                            isAnimating = false;
                        }, 1000);
                    }
                }
            });

            comicBook.appendChild(pageEl);
        });

        function updateZIndices() {
            const pages = document.querySelectorAll('.page');
            pages.forEach((page, index) => {
                if (page.classList.contains('flipped')) {
                    // Flipped pages go to the left side, stack order needs to reverse
                    page.style.zIndex = index + 1;
                } else {
                    // Unflipped pages on the right side
                    page.style.zIndex = pages.length - index;
                }
            });
        }

        // Wheel to scroll
        window.addEventListener('wheel', (e) => {
            if (isAnimating) return;
            const pages = document.querySelectorAll('.page');
            
            if (e.deltaY > 50) {
                // Scroll down -> next page
                if (currentPage < pages.length) {
                    isAnimating = true;
                    pages[currentPage].style.zIndex = 100; // Keep on top during flip
                    pages[currentPage].classList.add('flipped');
                    currentPage++;
                    setTimeout(() => {
                        updateZIndices();
                        isAnimating = false;
                    }, 1000);
                }
            } else if (e.deltaY < -50) {
                // Scroll up -> prev page
                if (currentPage > 0) {
                    isAnimating = true;
                    currentPage--;
                    pages[currentPage].style.zIndex = 100; // Keep on top during flip
                    pages[currentPage].classList.remove('flipped');
                    setTimeout(() => {
                        updateZIndices();
                        isAnimating = false;
                    }, 1000);
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const mug = document.querySelector('.coffee-mug');
            mug.addEventListener('mouseover', () => {

            mug.addEventListener('mouseout', () => {

                }, 500);
            });
