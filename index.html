<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Projects Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #4b0082;
            --tertiary: #ff1493;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            --hover-bg: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1200px;
            width: 90%;
            margin: 0 auto;
            padding: 4rem 2rem;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.3);
            background: -webkit-linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
            transition: all 0.5s ease;
        }

        .project-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: var(--hover-bg);
            box-shadow: 0 15px 45px 0 rgba(0, 0, 0, 0.3);
            border-color: rgba(255,255,255,0.4);
        }

        .project-card:hover::before {
            left: 200%;
        }

        .project-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            z-index: 2;
        }
        
        .project-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .project-card:hover .project-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .back-home {
            display: inline-block;
            margin-top: 4rem;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Floating elements for extra dynamic feel */
        .shape {
            position: absolute;
            filter: blur(50px);
            z-index: 1;
            opacity: 0.6;
            animation: float 10s ease-in-out infinite;
        }

        .shape-1 {
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: #ffb88e;
            border-radius: 50%;
        }

        .shape-2 {
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: #ea5455;
            border-radius: 50%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(10deg); }
            66% { transform: translate(-20px, 20px) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .container { padding: 2rem 1rem; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="container">
        <header>
            <h1>Fun Projects Showcase</h1>
            <p class="subtitle">A collection of interactive experiments and creative works</p>
        </header>

        <div class="projects-grid">
            <a href="cli-folio/" class="project-card">
                <div class="project-icon">💻</div>
                <div class="project-title">Cli Folio</div>
            </a>
            
            <a href="comicbook/" class="project-card">
                <div class="project-icon">🦸‍♂️</div>
                <div class="project-title">Comicbook</div>
            </a>
            
            <a href="desktop/" class="project-card">
                <div class="project-icon">🖥️</div>
                <div class="project-title">Desktop</div>
            </a>
            
            <a href="factory/" class="project-card">
                <div class="project-icon">🏭</div>
                <div class="project-title">Factory</div>
            </a>
            
            <a href="game-folio/" class="project-card">
                <div class="project-icon">🎮</div>
                <div class="project-title">Game Folio</div>
            </a>
            
            <a href="toons-folio/" class="project-card">
                <div class="project-icon">🎨</div>
                <div class="project-title">Toons Folio</div>
            </a>
        </div>
        
        <div style="text-align: center;">
            <a href="/" class="back-home">← Back to Main Site</a>
        </div>
    </div>

</body>
</html>
